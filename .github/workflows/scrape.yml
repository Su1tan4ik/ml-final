name: Scrape Traffic Data

# V1 collector, retired: V2 collects on the server (scripts/v2, collector container).
# Its last data commit was 2026-06-12; the schedule is off so both collectors never hit
# Yandex at the same time. Manual run still possible (Actions -> Run workflow).
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scraper dependencies
        run: pip install aiohttp Pillow requests

      - name: Run scraper
        working-directory: scraper
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python scraper.py

      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/traffic_data.csv
          git diff --staged --quiet || \
            git commit -m "data: scrape $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push
