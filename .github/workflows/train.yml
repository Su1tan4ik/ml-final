name: Feature Engineering + Retrain + Deploy

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (08:00 Almaty)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feature engineering  (raw → data.csv)
        env:
          STAGING_PATH:   data/raw/traffic_data.csv
          PROCESSED_PATH: data.csv
        run: python scripts/feature_engineering.py

      - name: Train models
        env:
          DATA_PATH: data.csv
          MODEL_DIR: models
          PLOT_DIR:  static/plots
        run: python train.py

      - name: Commit models + data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv models/ static/plots/ static/map_data.json
          git diff --staged --quiet || \
            git commit -m "models: retrain $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      # HF Spaces free tier = 1 GB storage. Pushing full history accumulates
      # every daily copy of data.csv + models (LFS) and hits the limit.
      # So: squash Space history (frees old LFS objects), push a single-commit
      # snapshot (no history), then squash again. Full history stays on GitHub.
      - name: Squash HF Space history (before push)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import HfApi; HfApi().super_squash_history('Rakhymzhan/almaty-traffic', repo_type='space', branch='main')"

      - name: Push to HF Spaces (snapshot, no history)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://Rakhymzhan:${HF_TOKEN}@huggingface.co/spaces/Rakhymzhan/almaty-traffic || true
          git checkout --orphan hf-snapshot
          git commit -m "deploy: snapshot of ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push space hf-snapshot:main --force

      - name: Squash HF Space history (after push)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from huggingface_hub import HfApi; HfApi().super_squash_history('Rakhymzhan/almaty-traffic', repo_type='space', branch='main')"

      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -s "$RENDER_HOOK"
          fi
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
